  <path d="M88 44 Q94 32 100 44 Q106 32 112 44" fill="none" stroke="#5b4636" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="78" cy="96" rx="9" ry="11" fill="#2b2222"/>
  <ellipse cx="122" cy="96" rx="9" ry="11" fill="#2b2222"/>
  <circle cx="81" cy="92" r="3.5" fill="#fff"/>
  <circle cx="125" cy="92" r="3.5" fill="#fff"/>
  <!-- cheeks -->
  <ellipse cx="64" cy="116" rx="8" ry="4" fill="#f7b6c2" opacity=".8"/>
  <ellipse cx="136" cy="116" rx="8" ry="4" fill="#f7b6c2" opacity=".8"/>
  <!-- snout -->
  <ellipse cx="100" cy="146" rx="46" ry="30" fill="#f7b6c2" stroke="#5b4636" stroke-width="4"/>
  <ellipse cx="84" cy="142" rx="7" ry="9" fill="#b76b7b"/>
  <ellipse cx="116" cy="142" rx="7" ry="9" fill="#b76b7b"/>
  <path d="M86 162 Q100 172 114 162" fill="none" stroke="#5b4636" stroke-width="3" stroke-linecap="round"/>
  <!-- bell -->
  <path d="M90 174 Q100 168 110 174 L112 186 L88 186Z" fill="#f5c542" stroke="#8a6a12" stroke-width="3"/>
  <circle cx="100" cy="188" r="3" fill="#8a6a12"/>
