  <ellipse cx="100" cy="186" rx="62" ry="8" fill="#000" opacity=".12"/>
  <!-- horns -->
  <path d="M58 52 Q44 26 60 20 Q58 38 70 48Z" fill="#f3e3c3" stroke="#5b4636" stroke-width="3"/>
  <path d="M142 52 Q156 26 140 20 Q142 38 130 48Z" fill="#f3e3c3" stroke="#5b4636" stroke-width="3"/>
  <!-- ears -->
  <ellipse cx="38" cy="70" rx="22" ry="11" transform="rotate(-20 38 70)" fill="#fff" stroke="#5b4636" stroke-width="3"/>
  <ellipse cx="162" cy="70" rx="22" ry="11" transform="rotate(20 162 70)" fill="#fff" stroke="#5b4636" stroke-width="3"/>
  <ellipse cx="38" cy="70" rx="12" ry="5" transform="rotate(-20 38 70)" fill="#f7b6c2"/>
  <ellipse cx="162" cy="70" rx="12" ry="5" transform="rotate(20 162 70)" fill="#f7b6c2"/>
  <!-- head -->
  <path d="M52 60 Q100 30 148 60 Q162 110 140 140 L60 140 Q38 110 52 60Z" fill="#fff" stroke="#5b4636" stroke-width="4"/>
  <!-- spots -->
  <path d="M60 64 Q78 52 88 66 Q82 86 64 82 Q54 74 60 64Z" fill="#3b2f2f"/>
  <path d="M128 58 Q146 62 144 80 Q132 90 122 76 Q120 64 128 58Z" fill="#3b2f2f"/>
